map.colorSpace = THREE.SRGBColorSpace;
map.wrapS = THREE.RepeatWrapping;
map.anisotropy = 8;

// fine grain for the matte surface
const bc = document.createElement('canvas'); bc.width = bc.height = 512;
const bg = bc.getContext('2d');
bg.fillStyle = '#808080'; bg.fillRect(0, 0, 512, 512);
for (let i = 0; i < 40000; i++) {
  const s = rr(90, 170) | 0;
  bg.fillStyle = `rgb(${s},${s},${s})`;
  bg.fillRect(rand() * 512, rand() * 512, 2, 2);
}
const bump = new THREE.CanvasTexture(bc);
bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
bump.repeat.set(6, 6);

// ---------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
if (params.has('top')) camera.position.set(0, 9.5, 0.01); else camera.position.set(0.6, 3.4, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 16;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0xe8dcc8, 1.7));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.7);
sun.position.set(-4.5, 6, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 20 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
scene.add(sun);

const vase = new THREE.Mesh(
  new THREE.LatheGeometry(pts, 128),
  new THREE.MeshStandardMaterial({ map, bumpMap: bump, bumpScale: 0.5, roughness: 0.85, metalness: 0, side: THREE.DoubleSide }),
);
vase.castShadow = vase.receiveShadow = true;
const pivot = new THREE.Group();
pivot.add(vase);
scene.add(pivot);


// ---------- flip to see the underside
let flipped = params.has('flip'), angle = flipped ? Math.PI : 0;
document.getElementById('flip').onclick = () => { flipped = !flipped; };
const place = () => {
  pivot.rotation.x = angle;
  pivot.position.y = RIM_Y / 2 * (1 - Math.cos(angle)) + Math.sin(angle) * 1.3;
};
place();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  const target = flipped ? Math.PI : 0;
  if (Math.abs(target - angle) > 0.001) { angle += (target - angle) * 0.1; place(); }
  controls.update();
  renderer.render(scene, camera);
});
</script>
